<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        padding: 24px 12px;
        background: #f1f5f9;
        color: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
      }
      .mx-auto {
        margin-left: auto;
        margin-right: auto;
      }
      .max-w-xl {
        max-width: 600px;
      }
      .rounded-2xl {
        border-radius: 16px;
      }
      .bg-white {
        background-color: #ffffff;
      }
      .p-8 {
        padding: 32px;
      }
      .text-slate-600 {
        color: #475569;
      }
      .text-teal-700 {
        color: #0f766e;
      }
      .font-bold {
        font-weight: 700;
      }
      .text-2xl {
        font-size: 24px;
      }
      .leading-relaxed {
        line-height: 1.65;
      }
      @media only screen and (max-width: 600px) {
        .p-8 {
          padding: 24px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px 12px;
      background-color: #f1f5f9;
      color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <main
      class="mx-auto max-w-xl rounded-2xl bg-white p-8"
      style="
        max-width: 600px;
        margin: 0 auto;
        padding: 32px;
        border-radius: 16px;
        background-color: #ffffff;
      "
    >
      <div
        class="text-teal-700 font-bold"
        style="color: #0f766e; font-weight: 700"
      >
        Nexora
      </div>
      <h1
        class="text-2xl font-bold"
        style="margin: 16px 0; font-size: 24px; line-height: 1.3"
      >
        {% block title %}{% endblock %}
      </h1>
      <div
        class="text-slate-600 leading-relaxed"
        style="color: #475569; line-height: 1.65"
      >
        {% block content %}{% endblock %}
      </div>
    </main>
  </body>
</html>
